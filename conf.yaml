train:
  plant:  # Physical limits and auxiliaries for the plant model
    v_max_mps: 50.0
    kinematic_gain_mps_per_watt: 1.0e-6
    p_aux_base_watts: 60000
  battery:  # Battery sizing and efficiency
    e_batt_kwh: 200.0
    p_batt_max_discharge_kw: 3000.0
    p_batt_max_charge_kw: 1000.0
    eta_charge: 0.95
    eta_discharge: 0.94
    soc_init_min: 0.45
    soc_init_max: 0.45
    soc_hard_min: 0.15
    soc_hard_max: 1.00
  fuel_cell:  # Fuel-cell stack limits
    p_fc_max_kw: 100.0
    eta_fc: 0.50
    h2_lhv_kwh_per_kg: 33.3
    tank_capacity_kg: 50.0
    tank_init_min: 0.70
    tank_init_max: 1.00
    tank_hard_min: 0.02
    ramp_kw_per_s: 40.0
  shield:  # Safety corridor and enforcement toggles
    soc_soft_min: 0.20
    soc_soft_max: 0.90
    enforce_soc_corridor: true
    enforce_fc_ramp: true
    enforce_crate_caps: true
  costs:  # Energy prices used inside reward
    c_h2_eur_per_kg: 6.0
    c_grid_eur_per_kwh: 0.18

scenario:
  sim:  # Episode timing/random seed
    dt_seconds: 1
    episode_steps_min: 1800
    episode_steps_max: 2400
    seed: 123
  route:
    profiles: ["nil_short_mountain"]
    grade_segments_percent: [0.009, 0.0238, 0.009, -0.018, -0.018, 0.018]  # ~9‰ avg, ~23.8‰ max
    segment_duration_s: 2000.0  # ~2km segments  
    speed_limits_mps: [25.0, 22.22, 22.22, 22.22, 22.22, 22.22]  # 90/60 km/h limits
  stops:
    count: 4
    dwell_mean_s: 120.0
    dwell_jitter_frac: 0.2
  driver:  # Driver/ATO parameters  
    p_req_smoothing_tau_s: 3.0
    p_req_rate_limit_kw_per_s: 1000.0
    p_loss_watts: 200000.0
    manual_speed_profile:
      - duration_s: 200
        speed_mps: 0.0
        label: "Station A"
        hold: true
      - duration_s: 300
        speed_mps: 20.0
        label: "Depart A"
        grade_percent: 0.009
        p_bias_kw: 50.0
      - duration_s: 1000
        speed_mps: 22.22
        label: "Climb 1"
        grade_percent: 0.0238
        p_bias_kw: 100.0
      - duration_s: 600
        speed_mps: 22.22
        label: "Station B"
        hold: true
      - duration_s: 300
        speed_mps: 20.0
        label: "Depart B"
        grade_percent: 0.009
        p_bias_kw: 50.0
      - duration_s: 800
        speed_mps: 22.22
        label: "Climb 2"
        grade_percent: -0.018
        p_bias_kw: -20.0
      - duration_s: 200
        speed_mps: 0.0
        label: "Station C"
        hold: true
    manual_speed_profile:  # Optional speed profile for the driver PID
      - duration_s: 150
        speed_mps: 0.0
        label: "Station A dwell"
        hold: true
      - duration_s: 180
        speed_mps: 8.0
        label: "Depart A (phase 1)"
        grade_percent: 0.3
        p_bias_kw: 20.0
      - duration_s: 200
        speed_mps: 16.0
        label: "Depart A (phase 2)"
        grade_percent: 0.4
        p_bias_kw: 35.0
      - duration_s: 220
        speed_mps: 22.0
        label: "Settle to suburban"
        grade_percent: 0.5
        p_bias_kw: 55.0
      - duration_s: 400
        speed_mps: 22.0
        label: "Suburban cruise"
        grade_percent: 0.2
        p_bias_kw: 10.0
      - duration_s: 240
        speed_mps: 26.0
        label: "Climb 1"
        grade_percent: 0.7
        p_bias_kw: 80.0
      - duration_s: 240
        speed_mps: 30.0
        label: "Climb 2"
        grade_percent: 0.8
        p_bias_kw: 95.0
      - duration_s: 360
        speed_mps: 30.0
        label: "Plateau cruise"
        grade_percent: 0.0
        p_bias_kw: 0.0
      - duration_s: 200
        speed_mps: 27.0
        label: "Shallow dip"
        grade_percent: -0.3
        p_bias_kw: -20.0
      - duration_s: 220
        speed_mps: 33.0
        label: "Shallow rise"
        grade_percent: 0.3
        p_bias_kw: 25.0
      - duration_s: 300
        speed_mps: 18.0
        label: "Approach B"
        grade_percent: -0.6
        p_bias_kw: -70.0
      - duration_s: 180
        speed_mps: 0.0
        label: "Station B dwell"
        hold: true
      - duration_s: 160
        speed_mps: 10.0
        label: "Depart B (phase 1)"
        grade_percent: 0.3
        p_bias_kw: 18.0
      - duration_s: 200
        speed_mps: 20.0
        label: "Depart B (phase 2)"
        grade_percent: 0.4
        p_bias_kw: 30.0
      - duration_s: 240
        speed_mps: 28.0
        label: "Rebuild speed"
        grade_percent: 0.5
        p_bias_kw: 60.0
      - duration_s: 260
        speed_mps: 36.0
        label: "Express climb"
        grade_percent: 0.6
        p_bias_kw: 75.0
      - duration_s: 360
        speed_mps: 36.0
        label: "Express cruise"
        grade_percent: 0.0
        p_bias_kw: 0.0
      - duration_s: 280
        speed_mps: 20.0
        label: "Terminal approach"
        grade_percent: -0.7
        p_bias_kw: -80.0
      - duration_s: 200
        speed_mps: 0.0
        label: "Station C dwell"
        hold: true
    speed_target_smoothing_tau_s: 14.0
    speed_tracking_tau_s: 16.0
    speed_tracking_accel_limit_mps2: 0.20
    speed_tracking_brake_limit_mps2: 0.25
    dwell_speed_threshold_mps: 0.4
    speed_control_power_clip_kw: 500.0
    speed_tracking_jerk_limit_mps3: 0.10
    speed_tracking_use_pid: true
    speed_pid_kp: 0.004
    speed_pid_ki: 0.04
    speed_pid_kd: 0.03
    speed_pid_integral_limit: 0.6
    speed_pid_derivative_filter_tau_s: 1.5
    # Additional smoothing and anti-windup controls
    speed_error_deadband_mps: 0.20
    speed_integral_separation_mps: 0.6
    speed_disable_integral_when_saturated: true
    speed_measurement_filter_tau_s: 5.0
    # Trajectory filtering + preview planner
    speed_profile_dt_seconds: 1.0
    speed_profile_filter_enable: true
    speed_profile_filter_tau_s: 10.0
    speed_preview_horizon_s: 18.0
    speed_planner_enable: true
    speed_planner_horizon_s: 14.0
    speed_planner_min_horizon_s: 6.0
    speed_planner_penalty_accel: 0.15
    speed_planner_penalty_jerk: 0.05
  reward_weights:  # Per-step reward components
    lambda_smooth: 0.01
    lambda_delay: 0.5
    lambda_unmet: 1.0e-6
  randomization:  # Episode-to-episode randomness
    passenger_mass_tons_min: 180.0
    passenger_mass_tons_max: 260.0
    aux_bias_rw_sigma_kw: 0.0
    soc_init_uniform: true
    tank_init_uniform: true
    timetable_jitter_enable: true
  observations:  # Observation normalization and noise
    include_p_req_kw: true
    include_last_action: true
    include_noise_channels: 3
    normalize_to_unit_box: true
    p_req_max_kw: 2000.0
    soc_noise_std: 0.02
    tank_noise_std: 0.02
    nuisance_noise_std: 0.1
  renderer:  # UI/renderer defaults (always force-enabled by test harness)
    enabled: true
    mode: human
    render_every: 5
    rolling_window_s: 180
    dpi: 110
    figsize: [16, 9]
    show_hidden_debug: false
    draw_schedule: true
    write_video: false
    video_path: "runs/env0_episode.mp4"
    write_png_every: 0
    interactive: false
    colors:
      demand: "#000000"
      fc: "#1f77b4"
      batt_dis: "#ff7f0e"
      batt_chg: "#2ca02c"
      unmet: "#d62728"
      soc_band: "#e5e5e5"
  logging:  # Optional metrics captured by env/test harness
    log_terms:
      - reward_total
      - cost_h2
      - cost_grid
      - penalty_unmet
      - penalty_delay
      - penalty_smooth
    trace_signals:
      - speed_mps
      - soc
      - tank_level_norm
      - p_req_kw
      - p_fc_kw
      - p_batt_kw
      - p_unmet_kw
    kpi_aggregates:
      - euro_per_km_proxy
      - kg_h2_per_100km
      - kwh_charge_per_100km
      - delay_seconds_total
      - fc_action_jerk
      - batt_energy_throughput_kwh
      - constraint_violations

policy:
  default: scenario  # Policy to use when CLI asks for --policy auto
  baseline: {}
  balanced:
    target_soc: 0.80
    charge_boost_kw: 60.0
  scenario: {}       # Scenario-aware EMS tuning overrides
  mpc:
    horizon_s: 45
    n_grid: 8
