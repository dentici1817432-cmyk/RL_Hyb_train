sim:
  dt_seconds: 1
  episode_steps_min: 3600
  episode_steps_max: 5400
  seed: 123

driver:
  p_req_smoothing_tau_s: 12.0      # LPF time-constant for P_req (very smooth)
  p_req_rate_limit_kw_per_s: 120.0  # Max P_req change per second for extra smoothing
  p_loss_watts: 20000               # Baseline losses (kW)
  manual_loop: false
  manual_p_req_profile:
    - duration_s: 300
      p_req_kw: 0.0
    - duration_s: 600
      p_req_kw: 80.0
    - duration_s: 600
      p_req_kw: 140.0
    - duration_s: 400
      p_req_kw: 200.0
    - duration_s: 300
      p_req_kw: 120.0
    - duration_s: 600
      p_req_kw: 60.0
    - duration_s: 500
      p_req_kw: -40.0
    - duration_s: 400
      p_req_kw: -80.0
    - duration_s: 600
      p_req_kw: 50.0
    - duration_s: 800
      p_req_kw: 0.0
  manual_speed_profile:
    # Smooth, train-like profile with gentle ramps and long cruises
    - duration_s: 150
      speed_mps: 0.0
      label: "Station A dwell"
      hold: true
    # Gentle departure: 0 -> 8 -> 16 -> 22 m/s
    - duration_s: 180
      speed_mps: 8.0
      label: "Depart A (phase 1)"
      grade_percent: 0.3
      p_bias_kw: 20.0
    - duration_s: 200
      speed_mps: 16.0
      label: "Depart A (phase 2)"
      grade_percent: 0.4
      p_bias_kw: 35.0
    - duration_s: 220
      speed_mps: 22.0
      label: "Settle to suburban"
      grade_percent: 0.5
      p_bias_kw: 55.0
    # Long suburban cruise
    - duration_s: 400
      speed_mps: 22.0
      label: "Suburban cruise"
      grade_percent: 0.2
      p_bias_kw: 10.0
    # Smooth climb to 30 m/s
    - duration_s: 240
      speed_mps: 26.0
      label: "Climb 1"
      grade_percent: 0.7
      p_bias_kw: 80.0
    - duration_s: 240
      speed_mps: 30.0
      label: "Climb 2"
      grade_percent: 0.8
      p_bias_kw: 95.0
    # Plateau cruise with slight undulation
    - duration_s: 360
      speed_mps: 30.0
      label: "Plateau cruise"
      grade_percent: 0.0
      p_bias_kw: 0.0
    - duration_s: 200
      speed_mps: 27.0
      label: "Shallow dip"
      grade_percent: -0.3
      p_bias_kw: -20.0
    - duration_s: 220
      speed_mps: 33.0
      label: "Shallow rise"
      grade_percent: 0.3
      p_bias_kw: 25.0
    # Prepare for mid-stop with long, gentle braking
    - duration_s: 300
      speed_mps: 18.0
      label: "Approach B"
      grade_percent: -0.6
      p_bias_kw: -70.0
    - duration_s: 180
      speed_mps: 0.0
      label: "Station B dwell"
      hold: true
    # Second leg: gentle departure to express
    - duration_s: 160
      speed_mps: 10.0
      label: "Depart B (phase 1)"
      grade_percent: 0.3
      p_bias_kw: 18.0
    - duration_s: 200
      speed_mps: 20.0
      label: "Depart B (phase 2)"
      grade_percent: 0.4
      p_bias_kw: 30.0
    - duration_s: 240
      speed_mps: 28.0
      label: "Rebuild speed"
      grade_percent: 0.5
      p_bias_kw: 60.0
    - duration_s: 260
      speed_mps: 36.0
      label: "Express climb"
      grade_percent: 0.6
      p_bias_kw: 75.0
    - duration_s: 360
      speed_mps: 36.0
      label: "Express cruise"
      grade_percent: 0.0
      p_bias_kw: 0.0
    # Long, gentle terminal approach
    - duration_s: 280
      speed_mps: 20.0
      label: "Terminal approach"
      grade_percent: -0.7
      p_bias_kw: -80.0
    - duration_s: 200
      speed_mps: 0.0
      label: "Station C dwell"
      hold: true
  speed_target_smoothing_tau_s: 12.0
  speed_tracking_tau_s: 14.0
  speed_tracking_accel_limit_mps2: 0.20
  speed_tracking_brake_limit_mps2: 0.25
  dwell_speed_threshold_mps: 0.4
  speed_control_power_clip_kw: 500.0
  speed_tracking_jerk_limit_mps3: 0.12
  speed_tracking_use_pid: true
  speed_pid_kp: 0.05
  speed_pid_ki: 0.01
  speed_pid_kd: 0.02
  speed_pid_integral_limit: 0.8
  speed_pid_derivative_filter_tau_s: 1.2

plant:
  v_max_mps: 50.0
  kinematic_gain_mps_per_watt: 1.0e-6
  p_aux_base_watts: 60000        # Lower base auxiliaries (60 kW)

battery:
  e_batt_kwh: 200.0               # Lower capacity to make FC usage necessary
  p_batt_max_discharge_kw: 3000.0 # Very large discharge power to eliminate unmet (was 600.0)
  p_batt_max_charge_kw: 1000.0    # Increased charge power (was 300.0)
  eta_charge: 0.95
  eta_discharge: 0.94
  soc_init_min: 0.45
  soc_init_max: 0.45
  soc_hard_min: 0.15
  soc_hard_max: 1.00

fuel_cell:
  p_fc_max_kw: 100.0              # Reduced max power
  eta_fc: 0.50
  h2_lhv_kwh_per_kg: 33.3
  tank_capacity_kg: 50.0
  tank_init_min: 0.70           # normalized fraction of full mass
  tank_init_max: 1.00
  tank_hard_min: 0.02            # minimum tank level for termination
  ramp_kw_per_s: 40.0            # Restore realistic ramp rate

shield:
  soc_soft_min: 0.20
  soc_soft_max: 0.90
  enforce_soc_corridor: true      # Re-enable safety constraints
  enforce_fc_ramp: true           # Re-enable FC ramp
  enforce_crate_caps: true        # Re-enable C-rate caps

costs:
  c_h2_eur_per_kg: 6.0
  c_grid_eur_per_kwh: 0.18

reward_weights:
  lambda_smooth: 0.01
  lambda_delay: 0.5
  lambda_unmet: 1.0e-6

randomization:
  passenger_mass_tons_min: 180.0
  passenger_mass_tons_max: 260.0
  aux_bias_rw_sigma_kw: 0.0      # Disabled for testing (was 0.10)
  soc_init_uniform: true
  tank_init_uniform: true
  timetable_jitter_enable: true

observations:
  include_p_req_kw: true
  include_last_action: true
  include_noise_channels: 3
  normalize_to_unit_box: true
  p_req_max_kw: 2000.0          # max P_req for normalization
  soc_noise_std: 0.02            # SOC observation noise std
  tank_noise_std: 0.02           # tank observation noise std
  nuisance_noise_std: 0.1        # nuisance noise channels std

renderer:
  enabled: true
  mode: human                    # human | rgb_array | ansi
  render_every: 5                # steps
  rolling_window_s: 180
  dpi: 110
  figsize: [16, 9]
  show_hidden_debug: false
  draw_schedule: true
  write_video: false
  video_path: "runs/env0_episode.mp4"
  write_png_every: 0             # 0 = disabled, else step interval
  interactive: false             # Enable interactive slider for time scrubbing (uses pygame)
  colors:
    demand: "#000000"
    fc: "#1f77b4"
    batt_dis: "#ff7f0e"
    batt_chg: "#2ca02c"
    unmet: "#d62728"
    soc_band: "#e5e5e5"

logging:
  log_terms:
    - reward_total
    - cost_h2
    - cost_grid
    - penalty_unmet
    - penalty_delay
    - penalty_smooth
  trace_signals:
    - speed_mps
    - soc
    - tank_level_norm
    - p_req_kw
    - p_fc_kw
    - p_batt_kw
    - p_unmet_kw
  kpi_aggregates:
    - euro_per_km_proxy
    - kg_h2_per_100km
    - kwh_charge_per_100km
    - delay_seconds_total
    - fc_action_jerk
    - batt_energy_throughput_kwh
    - constraint_violations
